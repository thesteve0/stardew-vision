# Downloaded, hash-verified Hugging Face adapter; no historical EFS dependency.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lora-adapter
  namespace: stardew-vision
  labels:
    app: stardew-vision
    component: lora-adapter
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-csi
  resources:
    requests:
      storage: 20Gi
