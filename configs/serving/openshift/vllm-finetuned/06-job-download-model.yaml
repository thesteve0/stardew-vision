# Pinned base model, separate cache; GPU selector binds in a GPU availability zone.
apiVersion: batch/v1
kind: Job
metadata:
  name: download-qwen-model-finetuned
  namespace: stardew-vision
  labels:
    app: stardew-vision
    component: vllm-finetuned
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: download
          image: python:3.12-slim@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --target=/tmp/hf-packages huggingface_hub==0.36.0 && \
              PYTHONPATH=/tmp/hf-packages python -c "
              from huggingface_hub import snapshot_download
              snapshot_download(
                  'Qwen/Qwen2.5-VL-7B-Instruct',
                  revision='cc594898137f460bfe9f0759e9844b3ce807cfb5',
                  local_dir='/mnt/models',
                  local_dir_use_symlinks=False,
              )
              print('Download complete.')
              "
          env:
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /tmp/hf_home
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: model-cache
              mountPath: /mnt/models
            # Bind both claims on the same GPU node/zone before either is served.
            - name: adapter-cache
              mountPath: /mnt/lora-adapter
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache-finetuned
        - name: adapter-cache
          persistentVolumeClaim:
            claimName: lora-adapter
