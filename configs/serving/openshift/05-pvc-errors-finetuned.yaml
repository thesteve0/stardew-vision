# Separate RWO storage avoids cross-node attachment conflicts with the base coordinator.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: error-screenshots-finetuned
  namespace: stardew-vision
spec:
  storageClassName: gp3-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
