apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts-tool
  namespace: stardew-vision
  labels:
    app: stardew-vision
    component: tts-tool
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      component: tts-tool
  template:
    metadata:
      labels:
        app: stardew-vision
        component: tts-tool
    spec:
      initContainers:
        - name: download-kokoro
          image: ghcr.io/thesteve0/stardew-tts-tool:v0.4.0@sha256:2fad9aa8a9855b16dd078f3f1974fe9eaebc6964692d3edc52ab52c038706976
          command: ["/bin/sh", "-c"]
          args:
            - |
              uv run --frozen python -c "from stardew_tts.synthesize import synthesize; synthesize('test')"
          env:
            - name: HF_HOME
              value: /cache
          volumeMounts:
            - name: hf-cache
              mountPath: /cache
      containers:
        - name: tts
          image: ghcr.io/thesteve0/stardew-tts-tool:v0.4.0@sha256:2fad9aa8a9855b16dd078f3f1974fe9eaebc6964692d3edc52ab52c038706976
          startupProbe:
            httpGet:
              path: /health
              port: 8003
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          ports:
            - containerPort: 8003
              protocol: TCP
          env:
            - name: HF_HOME
              value: /cache
          resources:
            requests:
              cpu: 1000m
              memory: 3Gi
            limits:
              cpu: 2000m
              memory: 6Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: hf-cache
              mountPath: /cache
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache
---
apiVersion: v1
kind: Service
metadata:
  name: tts-tool
  namespace: stardew-vision
spec:
  selector:
    component: tts-tool
  ports:
    - port: 8003
      targetPort: 8003
      protocol: TCP
